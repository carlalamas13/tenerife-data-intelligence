[project]
name = "tenerife-data-intelligence"
version = "0.1.0"
description = "End-to-end data platform for tourism intelligence in Tenerife"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "pyarrow>=17,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

ingestion = [
  "tqdm>=4.66,<5",
]

[tool.ruff]
line-length = 100

enforce-ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
